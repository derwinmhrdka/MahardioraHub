services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: dealhub
      POSTGRES_PASSWORD: dealhub
      POSTGRES_DB: dealhub
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealhub -d dealhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://dealhub:dealhub@db:5432/dealhub
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASS: ${ADMIN_PASS:-changeme}
      # Inside the container only — does not use host :3000 / :3001
      PORT: "3000"
      NODE_ENV: production
    ports:
      # Host nginx proxies here (default 13000). Change APP_HOST_PORT in .env if taken.
      - "127.0.0.1:${APP_HOST_PORT:-13000}:3000"

volumes:
  pgdata:
