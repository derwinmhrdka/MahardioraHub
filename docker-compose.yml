services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: dealhub
      POSTGRES_PASSWORD: dealhub
      POSTGRES_DB: dealhub
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealhub -d dealhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: migrate
    restart: "no"
    environment:
      DATABASE_URL: postgresql://dealhub:dealhub@db:5432/dealhub
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://dealhub:dealhub@db:5432/dealhub
      AUTH_SECRET: ${AUTH_SECRET:-change-me-to-a-long-random-string}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      AUTH_URL: ${AUTH_URL:-}
      DOMAIN: ${DOMAIN:-mahardiora-hub.teknodika.com}
      # Inside the container only — does not use host :3000 / :3001
      PORT: "3000"
      NODE_ENV: production
    ports:
      # Host nginx proxies here (default 13000). Change APP_HOST_PORT in .env if taken.
      - "127.0.0.1:${APP_HOST_PORT:-13000}:3000"
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
